services:
  - type: web
    name: portfolio-fullstack
    env: node
    plan: free
    buildCommand: |
      cd backend && npm install --no-audit --no-fund && npx prisma generate
      cd ../frontend && npm install --no-audit --no-fund && npm run build
      cd ../backend && mkdir -p public && cp -r ../frontend/dist/* public/
    startCommand: cd backend && npx prisma migrate deploy && node server.js
    # postDeployCommand removed; migrations run in startCommand
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: mysql://db31046:n%214AHp%3D6c8E%3F@db31046.public.databaseasp.net:3306/db31046
      - key: UPLOAD_DIR
        value: /var/data/uploads
