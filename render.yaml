services:
  - type: web
    name: ticket-backend
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && node server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  - type: web
    name: ticket-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ticket-backend.onrender.com

databases:
  - name: ticket-db
    databaseName: ticketdb
    user: ticketuser