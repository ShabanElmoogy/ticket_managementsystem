services:
  - type: web
    name: ticket-backend
    runtime: node
    buildCommand: npm run install:backend && npm run build:backend
    startCommand: npm run start:backend

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ticket-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  - type: web
    name: ticket-frontend
    runtime: static
    buildCommand: npm run install:frontend && npm run build:frontend
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ticket-backend.onrender.com

databases:
  - name: ticket-db
    databaseName: ticketdb
    user: ticketuser