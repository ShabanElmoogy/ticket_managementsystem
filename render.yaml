services:
  - type: web
    name: portfolio-fullstack
    env: node
    plan: free
    buildCommand: |
      npm install
      npx prisma generate
      npm run build
    startCommand: npm start
    postDeployCommand: npx prisma migrate deploy
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: mysql://db31046:n%214AHp%3D6c8E%3F@db31046.public.databaseasp.net:3306/db31046
      - key: UPLOAD_DIR
        value: /var/data/uploads
